<!DOCTYPE html>
<html>
<head>
  <title>Simplify Algorithm Comparison</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #fff;
      padding: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .panel {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 16px;
    }
    canvas {
      border: 1px solid #444;
      background: #fff;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #888;
    }
    .stats {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
    }
    .controls {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    input[type="range"] {
      width: 200px;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      font-family: monospace;
      font-size: 11px;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 8px;
      background: #333;
      border: 1px solid #555;
      color: #fff;
      font-family: monospace;
      font-size: 10px;
    }
    button {
      padding: 8px 16px;
      background: #4488ff;
      border: none;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #5599ff;
    }
    .diff {
      position: relative;
    }
    .similarity {
      font-weight: bold;
      color: #4f4;
    }
    .similarity.bad {
      color: #f44;
    }
  </style>
</head>
<body>
  <h1>Path Simplification Comparison</h1>

  <div class="controls panel">
    <label>Tolerance: <span id="tolValue">0.5</span></label>
    <input type="range" id="tolerance" min="0.01" max="5" step="0.01" value="0.5">

    <label>Test Path (paste path data JSON):</label>
    <textarea id="pathData" placeholder='[{"x": 0, "y": 0}, {"x": 1, "y": 1}, ...]'></textarea>

    <button id="runTest">Run Test</button>
    <button id="generateBlob">Generate Test Blob</button>
  </div>

  <div class="container">
    <div class="panel">
      <h2>Original</h2>
      <canvas id="original" width="400" height="400"></canvas>
      <div class="stats" id="originalStats"></div>
    </div>

    <div class="panel">
      <h2>Paper.js Simplify</h2>
      <canvas id="paperjs" width="400" height="400"></canvas>
      <div class="stats" id="paperjsStats"></div>
    </div>

    <div class="panel">
      <h2>RDP + Catmull-Rom</h2>
      <canvas id="rdp" width="400" height="400"></canvas>
      <div class="stats" id="rdpStats"></div>
    </div>

    <div class="panel diff">
      <h2>Difference (Paper.js)</h2>
      <canvas id="diffPaper" width="400" height="400"></canvas>
      <div class="stats" id="diffPaperStats"></div>
    </div>

    <div class="panel diff">
      <h2>Difference (RDP)</h2>
      <canvas id="diffRdp" width="400" height="400"></canvas>
      <div class="stats" id="diffRdpStats"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/paper.js/0.12.17/paper-full.min.js"></script>
  <script>
    // Initialize Paper.js
    paper.setup(document.createElement('canvas'));

    const toleranceSlider = document.getElementById('tolerance');
    const tolValue = document.getElementById('tolValue');
    const pathDataInput = document.getElementById('pathData');

    toleranceSlider.addEventListener('input', () => {
      tolValue.textContent = toleranceSlider.value;
    });

    // RDP algorithm
    function rdpSimplify(points, epsilon) {
      if (points.length <= 2) return points;

      let maxDist = 0;
      let maxIndex = 0;
      const first = points[0];
      const last = points[points.length - 1];

      for (let i = 1; i < points.length - 1; i++) {
        const dist = perpendicularDistance(points[i], first, last);
        if (dist > maxDist) {
          maxDist = dist;
          maxIndex = i;
        }
      }

      if (maxDist > epsilon) {
        const left = rdpSimplify(points.slice(0, maxIndex + 1), epsilon);
        const right = rdpSimplify(points.slice(maxIndex), epsilon);
        return [...left.slice(0, -1), ...right];
      } else {
        return [first, last];
      }
    }

    function perpendicularDistance(point, lineStart, lineEnd) {
      const dx = lineEnd.x - lineStart.x;
      const dy = lineEnd.y - lineStart.y;

      if (dx === 0 && dy === 0) {
        return Math.sqrt((point.x - lineStart.x) ** 2 + (point.y - lineStart.y) ** 2);
      }

      const t = Math.max(0, Math.min(1,
        ((point.x - lineStart.x) * dx + (point.y - lineStart.y) * dy) / (dx * dx + dy * dy)
      ));

      const projX = lineStart.x + t * dx;
      const projY = lineStart.y + t * dy;

      return Math.sqrt((point.x - projX) ** 2 + (point.y - projY) ** 2);
    }

    // Create a capsule (stadium shape) between two points
    function createCapsule(p1, p2, radius) {
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const len = Math.sqrt(dx * dx + dy * dy);

      if (len < 0.001) {
        // Just a circle
        return new paper.Path.Circle(new paper.Point(p1.x, p1.y), radius);
      }

      // Perpendicular unit vector
      const px = -dy / len;
      const py = dx / len;

      const path = new paper.Path();
      path.closed = true;

      // Bezier constant for quarter circle
      const k = 0.5522847498;

      // First semicircle (around p1)
      const a1 = { x: p1.x + px * radius, y: p1.y + py * radius };
      const a2 = { x: p1.x - px * radius, y: p1.y - py * radius };

      // Second semicircle (around p2)
      const b1 = { x: p2.x + px * radius, y: p2.y + py * radius };
      const b2 = { x: p2.x - px * radius, y: p2.y - py * radius };

      // Direction from p1 to p2
      const ux = dx / len;
      const uy = dy / len;

      // Build path: a1 -> b1 (straight) -> semicircle around p2 -> b2 -> a2 (straight) -> semicircle around p1

      // Start at a1
      path.add(new paper.Segment(
        new paper.Point(a1.x, a1.y),
        null,
        null
      ));

      // Straight to b1
      path.add(new paper.Segment(
        new paper.Point(b1.x, b1.y),
        null,
        new paper.Point(px * radius * k, py * radius * k)
      ));

      // Semicircle around p2: b1 -> p2+forward -> b2
      const p2fwd = { x: p2.x + ux * radius, y: p2.y + uy * radius };
      path.add(new paper.Segment(
        new paper.Point(p2fwd.x, p2fwd.y),
        new paper.Point(px * radius * k, py * radius * k),
        new paper.Point(-px * radius * k, -py * radius * k)
      ));

      path.add(new paper.Segment(
        new paper.Point(b2.x, b2.y),
        new paper.Point(-px * radius * k, -py * radius * k),
        null
      ));

      // Straight to a2
      path.add(new paper.Segment(
        new paper.Point(a2.x, a2.y),
        null,
        new paper.Point(-px * radius * k, -py * radius * k)
      ));

      // Semicircle around p1: a2 -> p1-backward -> a1
      const p1bwd = { x: p1.x - ux * radius, y: p1.y - uy * radius };
      path.add(new paper.Segment(
        new paper.Point(p1bwd.x, p1bwd.y),
        new paper.Point(-px * radius * k, -py * radius * k),
        new paper.Point(px * radius * k, py * radius * k)
      ));

      // Close back to a1
      path.segments[0].handleIn = new paper.Point(px * radius * k, py * radius * k);

      return path;
    }

    // Generate test blob from points
    function generateBlobPath(points, radius) {
      if (points.length === 0) return null;

      if (points.length === 1) {
        return new paper.Path.Circle(new paper.Point(points[0].x, points[0].y), radius);
      }

      let result = createCapsule(points[0], points[1], radius);

      for (let i = 1; i < points.length - 1; i++) {
        const capsule = createCapsule(points[i], points[i + 1], radius);
        result = result.unite(capsule);
        capsule.remove();
      }

      return result;
    }

    // Draw path to canvas
    function drawPath(canvas, path, color = 'black') {
      const ctx = canvas.getContext('2d');
      const bounds = path.bounds;

      // Calculate transform
      const padding = 20;
      const scale = Math.min(
        (canvas.width - padding * 2) / bounds.width,
        (canvas.height - padding * 2) / bounds.height
      );
      const offsetX = (canvas.width - bounds.width * scale) / 2 - bounds.x * scale;
      const offsetY = (canvas.height - bounds.height * scale) / 2 - bounds.y * scale;

      ctx.fillStyle = 'white';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = color;
      ctx.beginPath();

      function drawPathItem(item) {
        if (item.className === 'Path') {
          const segments = item.segments;
          if (segments.length > 0) {
            const first = segments[0];
            ctx.moveTo(first.point.x * scale + offsetX, first.point.y * scale + offsetY);

            for (let i = 0; i < segments.length; i++) {
              const curr = segments[i];
              const next = segments[(i + 1) % segments.length];

              if (i === segments.length - 1 && !item.closed) break;

              const cp1x = (curr.point.x + (curr.handleOut ? curr.handleOut.x : 0)) * scale + offsetX;
              const cp1y = (curr.point.y + (curr.handleOut ? curr.handleOut.y : 0)) * scale + offsetY;
              const cp2x = (next.point.x + (next.handleIn ? next.handleIn.x : 0)) * scale + offsetX;
              const cp2y = (next.point.y + (next.handleIn ? next.handleIn.y : 0)) * scale + offsetY;
              const x = next.point.x * scale + offsetX;
              const y = next.point.y * scale + offsetY;

              ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, x, y);
            }

            if (item.closed) ctx.closePath();
          }
        } else if (item.className === 'CompoundPath') {
          for (const child of item.children) {
            drawPathItem(child);
          }
        }
      }

      drawPathItem(path);
      ctx.fill('evenodd');

      return { scale, offsetX, offsetY, bounds };
    }

    // Get pixels from canvas
    function getPixels(canvas) {
      return canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
    }

    // Compare pixels and draw diff
    function comparePaths(canvas1, canvas2, diffCanvas) {
      const pixels1 = getPixels(canvas1);
      const pixels2 = getPixels(canvas2);
      const ctx = diffCanvas.getContext('2d');
      const imageData = ctx.createImageData(diffCanvas.width, diffCanvas.height);

      let diffCount = 0;
      const totalPixels = pixels1.length / 4;

      for (let i = 0; i < pixels1.length; i += 4) {
        const diff = Math.abs(pixels1[i] - pixels2[i]);

        if (diff > 10) {
          diffCount++;
          // Red for original only, green for simplified only
          if (pixels1[i] < pixels2[i]) {
            imageData.data[i] = 255;     // R - original had fill here
            imageData.data[i + 1] = 0;
            imageData.data[i + 2] = 0;
          } else {
            imageData.data[i] = 0;
            imageData.data[i + 1] = 255; // G - simplified has extra fill
            imageData.data[i + 2] = 0;
          }
          imageData.data[i + 3] = 255;
        } else {
          // Gray for matching
          const gray = pixels1[i];
          imageData.data[i] = gray;
          imageData.data[i + 1] = gray;
          imageData.data[i + 2] = gray;
          imageData.data[i + 3] = 255;
        }
      }

      ctx.putImageData(imageData, 0, 0);

      return {
        similarity: 1 - diffCount / totalPixels,
        diffCount,
        totalPixels
      };
    }

    // RDP simplification that returns a paper.js path
    function simplifyWithRDP(path, tolerance) {
      // Sample the path
      const points = [];
      const length = path.length;
      const numSamples = Math.max(50, Math.floor(length / (tolerance * 0.5)));

      for (let i = 0; i <= numSamples; i++) {
        const offset = (i / numSamples) * length;
        const pt = path.getPointAt(offset);
        if (pt) points.push({ x: pt.x, y: pt.y });
      }

      // RDP simplify
      const simplified = rdpSimplify(points, tolerance);

      // Create new path
      const newPath = new paper.Path();
      newPath.closed = path.closed;

      for (const pt of simplified) {
        newPath.add(new paper.Point(pt.x, pt.y));
      }

      // Smooth with catmull-rom
      newPath.smooth({ type: 'catmull-rom', factor: 0.5 });

      return newPath;
    }

    // Run test
    function runTest() {
      const tolerance = parseFloat(toleranceSlider.value);
      let originalPath;

      // Try to parse path data
      const pathDataStr = pathDataInput.value.trim();
      if (pathDataStr) {
        try {
          const data = JSON.parse(pathDataStr);
          if (Array.isArray(data)) {
            // Array of points - generate blob
            originalPath = generateBlobPath(data, 0.5);
          } else if (data.segments) {
            // Full path object - reconstruct
            originalPath = new paper.Path();
            originalPath.closed = data.closed !== false;
            for (const seg of data.segments) {
              originalPath.add(new paper.Segment(
                new paper.Point(seg.point || seg.p0),
                seg.handleIn ? new paper.Point(seg.handleIn) : null,
                seg.handleOut ? new paper.Point(seg.handleOut) : null
              ));
            }
          }
        } catch (e) {
          console.error('Failed to parse path data:', e);
          alert('Invalid path data JSON');
          return;
        }
      }

      if (!originalPath) {
        alert('Please provide path data or generate a test blob');
        return;
      }

      // Draw original
      const origCanvas = document.getElementById('original');
      drawPath(origCanvas, originalPath);
      document.getElementById('originalStats').innerHTML =
        `Segments: ${countSegments(originalPath)}`;

      // Paper.js simplify
      const paperPath = originalPath.clone();
      paperPath.simplify(tolerance);

      const paperCanvas = document.getElementById('paperjs');
      drawPath(paperCanvas, paperPath);

      // RDP simplify
      let rdpPath;
      if (originalPath.className === 'CompoundPath') {
        rdpPath = new paper.CompoundPath();
        for (const child of originalPath.children) {
          rdpPath.addChild(simplifyWithRDP(child, tolerance));
        }
      } else {
        rdpPath = simplifyWithRDP(originalPath, tolerance);
      }

      const rdpCanvas = document.getElementById('rdp');
      drawPath(rdpCanvas, rdpPath);

      // Compare
      const paperDiff = comparePaths(origCanvas, paperCanvas, document.getElementById('diffPaper'));
      const rdpDiff = comparePaths(origCanvas, rdpCanvas, document.getElementById('diffRdp'));

      const paperSegs = countSegments(paperPath);
      const rdpSegs = countSegments(rdpPath);

      document.getElementById('paperjsStats').innerHTML =
        `Segments: ${paperSegs}<br>` +
        `Similarity: <span class="similarity ${paperDiff.similarity < 0.99 ? 'bad' : ''}">${(paperDiff.similarity * 100).toFixed(2)}%</span>`;

      document.getElementById('rdpStats').innerHTML =
        `Segments: ${rdpSegs}<br>` +
        `Similarity: <span class="similarity ${rdpDiff.similarity < 0.99 ? 'bad' : ''}">${(rdpDiff.similarity * 100).toFixed(2)}%</span>`;

      document.getElementById('diffPaperStats').innerHTML =
        `Different pixels: ${paperDiff.diffCount} / ${paperDiff.totalPixels}`;

      document.getElementById('diffRdpStats').innerHTML =
        `Different pixels: ${rdpDiff.diffCount} / ${rdpDiff.totalPixels}`;
    }

    function countSegments(path) {
      if (path.className === 'CompoundPath') {
        return path.children.reduce((sum, c) => sum + c.segments.length, 0);
      }
      return path.segments.length;
    }

    // Generate random blob for testing
    function generateTestBlob() {
      const points = [];
      const numPoints = 20 + Math.floor(Math.random() * 30);

      // Generate a squiggly path
      let x = 5, y = 5;
      for (let i = 0; i < numPoints; i++) {
        points.push({ x, y });
        x += (Math.random() - 0.3) * 2;
        y += (Math.random() - 0.5) * 1;
      }

      pathDataInput.value = JSON.stringify(points, null, 2);
      runTest();
    }

    document.getElementById('runTest').addEventListener('click', runTest);
    document.getElementById('generateBlob').addEventListener('click', generateTestBlob);
  </script>
</body>
</html>
